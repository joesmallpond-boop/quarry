name: Build QUARRY

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS installer (Standalone + VST3 + AU)
    runs-on: macos-14
    env:
      # Optional Apple signing / notarisation. Leave these secrets unset for an unsigned build.
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/^project(QUARRY VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build Standalone, VST3, AU
        run: cmake --build build --config Release -- -quiet

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm cert.p12

      - name: Code sign bundles
        env:
          APP_SIGN_ID: ${{ secrets.MACOS_APP_SIGN_ID }}
        run: |
          ID="-"; OPTS=""
          if [ "$HAS_CERT" = "true" ]; then ID="$APP_SIGN_ID"; OPTS="--options runtime --timestamp"; fi
          for b in build/*_artefacts/Release/VST3/*.vst3 build/*_artefacts/Release/AU/*.component build/*_artefacts/Release/Standalone/*.app; do
            codesign --force --deep $OPTS --sign "$ID" "$b"
          done

      - name: Validate Audio Units
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/*_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Qry4 Klbs
          auval -v aumf Qrfx Klbs
          rm -rf ~/Library/Audio/Plug-Ins/Components/QUARRY*

      - name: Build installer (.pkg inside .dmg)
        env:
          INSTALLER_SIGN_ID: ${{ secrets.MACOS_INSTALLER_SIGN_ID }}
        run: packaging/make_installer.sh build "${{ steps.ver.outputs.version }}"

      - name: Notarise
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PKG="dist/QUARRY Installer.pkg"
          xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$PKG"
          rm -f dist/*.dmg
          mkdir -p dmg && cp "$PKG" dmg/ && cp packaging/resources/readme.txt "dmg/Read Me.txt"
          hdiutil create -volname "QUARRY ${{ steps.ver.outputs.version }}" -srcfolder dmg -ov -format UDZO "dist/QUARRY-${{ steps.ver.outputs.version }}-mac.dmg"

      - name: Check installer contents
        run: |
          pkgutil --expand "dist/QUARRY Installer.pkg" pkgcheck
          ls pkgcheck
          for p in standalone vst3 au; do echo "== $p"; cat "pkgcheck/$p.pkg/PackageInfo" | head -3; done

      - uses: actions/upload-artifact@v4
        with:
          name: QUARRY-mac-installer
          path: |
            dist/*.dmg
            dist/*.pkg

  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Recurse build/Quarry_artefacts/Release/VST3/*.vst3 out/
          Copy-Item -Recurse build/QuarryFX_artefacts/Release/VST3/*.vst3 out/
          Copy-Item build/Quarry_artefacts/Release/Standalone/*.exe out/
          Compress-Archive -Path out/* -DestinationPath QUARRY-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QUARRY-windows
          path: QUARRY-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            QUARRY-mac-installer/*.dmg
            QUARRY-mac-installer/*.pkg
            QUARRY-windows/QUARRY-windows.zip
